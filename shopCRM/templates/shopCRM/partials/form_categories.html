<form method="post" id="categoryForm" action="{{ request.get_full_path }}">
    {% csrf_token %}
    <div class="modal-body-content">
        {{ form.as_p }}
    </div>
    <div class="modal-footer mt-3">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Скасувати</button>
        <button type="button" class="btn-add" onclick="saveCategory('{{ category_id|default:'' }}')">Зберегти</button>
    </div>
</form>
