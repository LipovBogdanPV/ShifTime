<style>
    /* Контейнер та таби */
    .card {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 3px 18px rgba(0, 0, 0, 0.08);
        margin: 20px;
        padding: 0;
        overflow: hidden;
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 22px;
        background: #f8fbff;
        border-bottom: 1px solid #e9ecef;
        gap: 12px;
        flex-wrap: wrap;
    }

    .card-body {
        padding: 22px;
        background: #ffffff;
    }

    .nav-tabs {
        display: flex;
        flex-wrap: wrap;
        border-bottom: none;
        list-style: none;
        padding: 0;
        margin: 0;
        gap: 10px;
    }

    .nav-link {
        padding: 10px 18px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: #f4f7f6;
        cursor: pointer;
        font-size: 14px;
        color: #4a5568;
        font-weight: 600;
        transition: 0.2s ease;
        min-width: 140px;
        text-align: center;
    }

    .nav-link:hover,
    .nav-link:focus {
        background: #e7f0ff;
        color: #1d4ed8;
    }

    .nav-link.active {
        background: #1d4ed8;
        color: #ffffff;
        border-color: #1d4ed8;
        box-shadow: 0 4px 12px rgba(29, 78, 216, 0.14);
    }

    .custom-tab-content {
        display: none;
    }

    #tab-score {
        display: block;
    }

    .card-body .d-flex {
        display: flex;
    }

    .gap-2 {
        gap: 10px;
    }

    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 9px 16px;
        border-radius: 8px;
        border: 1px solid transparent;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s ease;
    }

    .btn-sm {
        padding: 7px 12px;
        font-size: 13px;
    }

    .btn-light {
        background: #f4f7f6;
        color: #2d3748;
        border-color: #d6dbe1;
    }

    .btn-light:hover {
        background: #e2e8f0;
    }

    .btn-outline-primary {
        background: transparent;
        color: #1d4ed8;
        border-color: #1d4ed8;
    }

    .btn-outline-primary:hover {
        background: rgba(29, 78, 216, 0.1);
    }

    #breadcrumb-container button {
        border: 1px solid #d6dbe1;
        background: #ffffff;
        color: #334155;
        border-radius: 999px;
        padding: 8px 14px;
    }

    .form-row,
    .row {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        margin: 0 -8px;
    }

    .col-md-7,
    .col-md-5,
    .col-md-4,
    .col-6 {
        box-sizing: border-box;
        padding: 0 8px;
    }

    .col-md-7 {
        flex: 0 0 58.3333%;
        max-width: 58.3333%;
    }

    .col-md-5 {
        flex: 0 0 41.6667%;
        max-width: 41.6667%;
    }

    .col-md-4 {
        flex: 0 0 31.3333%;
        max-width: 31.3333%;
    }

    .col-6 {
        flex: 0 0 48%;
        max-width: 48%;
    }

    .form-group {
        width: 100%;
        margin-bottom: 16px;
    }

    .form-group label,
    .form-check-label {
        display: block;
        margin-bottom: 8px;
        color: #334155;
        font-weight: 600;
    }

    .form-control {
        width: 100%;
        min-height: 40px;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #ffffff;
        color: #1f2937;
        font-size: 14px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-control:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
    }

    .form-check {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
    }

    .form-check-input {
        width: 18px;
        height: 18px;
        accent-color: #2563eb;
    }

    .form-check-label {
        margin-bottom: 0;
        font-weight: 500;
    }

    .mb-2 {
        margin-bottom: 12px !important;
    }

    .mb-3 {
        margin-bottom: 18px !important;
    }

    .border-left {
        border-left: 1px solid #e2e8f0;
    }

    #catalog-container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    #category-path {
        min-height: 35px;
        color: #334155;
    }

    #order-items-list {
        min-height: 120px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 14px;
    }

    h5 {
        margin-top: 0;
        margin-bottom: 16px;
        color: #0f172a;
        font-size: 18px;
    }
</style>
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <ul class="nav nav-tabs">
            <li class="nav-item">
                <button class="nav-link active" data-url="" onclick="showTab('score', this)">Чек/Рахунок</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-url="" onclick="showTab('contacts', this)">Адреса/Контакти</button>
            </li>
            <li class="nav-item">
                <!-- Показати дві вкладки Чек/Рахунок/Адреса/📊 Обидві разом -->
                <input class="nav-link" style="color: #28a745;" data-url="" onclick="showTab('both', this)" value="📊 Обидві разом" />
            </li>
        </ul>
        <div id="breadcrumb-container" class="d-flex gap-2">
            <button class="btn btn-sm btn-light" ></button>
        </div>
    </div>
    <div class="card-body" id="content-container"> 
        <div id="tab-score" class="custom-tab-content">
            {% include 'shopCRM/partials/score.html' %}
        </div>
        <div id="tab-contacts" class="custom-tab-content">
            {% include 'shopCRM/partials/contacts.html' %}
        </div>
    </div>
</div>
