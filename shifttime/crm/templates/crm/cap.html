{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}ShifTime CRM{% endblock %}</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ваш CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">

    <!-- Навігація -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">ShifTime CRM</a>
            <a class="navbar-brand" href="Add_product.html">Добавити товар в базу</a>
            <a class="navbar-brand" href="Order_list.html">Список замовлень</a>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        <!-- Контент сторінки -->
        {% endblock %}
    </div>

    <!-- Bootstrap JS (опціонально) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
